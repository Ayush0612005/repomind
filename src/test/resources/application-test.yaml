spring:
  ai:
    model:
      chat: none
      embedding: none
    ollama:
      init:
        pull-model-strategy: never
repomind:
  github:
    webhook-secret: test-webhook-secret
  limits:
    enabled: true
    # generous enough that no other integration test notices the limits
    anonymous:
      requests-per-minute: 100000
      daily-tokens: 100000000
    clients:
      - name: rate-test        # key: rate-test-key
        key-sha256: 13b4ace1755885a2194c37af17e59b6d6ea9f4f03e4d461e27330f038065b752
        requests-per-minute: 3
        daily-tokens: 100000000
      - name: budget-test      # key: budget-test-key
        key-sha256: 2df5dd5ab7659b56f8f02277b8d98bf268518a9dfa0efdd11fb35b7581d90dfa
        requests-per-minute: 1000
        daily-tokens: 1
      - name: mcp-budget-test  # key: mcp-budget-test-key; McpServerIT's own, so it can't spend LimitsIT's budget
        key-sha256: 9d1afcaf45ded7944a662060181ca8d109707e1e415919b747085b8faf9e7a30
        requests-per-minute: 1000
        daily-tokens: 1
      - name: admin-test       # key: admin-test-key; may index repositories and post reviews
        key-sha256: 0d46389428b4ebfa8757051ceae368473fc4b38a6e2a4ab0b70e0bf6b285fbf9
        requests-per-minute: 100000
        daily-tokens: 100000000
  chat:
    circuit-breaker:
      # tests fail the scripted model on purpose; a breaker opened by one test must not fail the next
      minimum-calls: 1000
  qa:
    # asynchronous asks reply 202 after this; short so tests of slow answers stay fast
    job-wait: 1s
