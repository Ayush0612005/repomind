spring:
  application:
    name: repomind
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/repomind}
    username: ${DB_USER:repomind}
    password: ${DB_PASSWORD:repomind}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      # the cache is an optimisation: fail fast and answer without it rather than wait on Redis
      timeout: 500ms
      connect-timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      # an ingestion can take minutes: take one job per poll and allow a long gap between polls so
      # the broker does not rebalance the partition away mid-job and redeliver it
      max-poll-records: 1
      properties:
        max.poll.interval.ms: 3600000
    listener:
      concurrency: 3
      ack-mode: record
  ai:
    model:
      # spring.ai.model.chat is deliberately unset, so both Claude and Ollama are configured and
      # ChatGateway falls back from one to the other (order: repomind.chat.order). To run on
      # Ollama alone, without an API key, set SPRING_AI_MODEL_CHAT=ollama.
      embedding: ollama
    mcp:
      server:
        # MCP over Streamable HTTP at /mcp, behind the same API keys and limits as /api. Set the
        # protocol explicitly: when it is unset the starter falls back to the older SSE transport
        protocol: STREAMABLE
        name: repomind
        version: 0.1.0
        instructions: >-
          RepoMind indexes Java repositories. Call list_repositories first, then search_code or
          explain_class to read code with file:line locations. ask_codebase answers a question with
          citations but spends the caller's token budget.
    retry:
      # Spring AI retries a failed call up to 10 times with backoff by default, which would make
      # falling back take minutes; retry once quickly and let ChatGateway move on
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${REPOMIND_ANTHROPIC_MODEL:claude-sonnet-5-5}
          max-tokens: 1500
          temperature: 0.1
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${REPOMIND_OLLAMA_CHAT_MODEL:qwen2.5-coder:7b}
          temperature: 0.1
          num-ctx: 16384
      embedding:
        options:
          model: nomic-embed-text
      init:
        pull-model-strategy: when_missing
        timeout: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

repomind:
  chat:
    order: ${REPOMIND_CHAT_ORDER:anthropic,ollama}
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-calls: 4
      open-for: 30s
  ingest:
    workdir: ${REPOMIND_WORKDIR:${java.io.tmpdir}/repomind}
  github:
    # optional for reading public repositories (60 requests/hour without it); required for private
    # repositories and for posting reviews
    token: ${GITHUB_TOKEN:}
    # the secret set on the GitHub webhook (Settings -> Webhooks); webhooks are rejected without it
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  limits:
    # identify callers by X-Api-Key and enforce per-client rate limits and daily model-token budgets
    enabled: ${REPOMIND_LIMITS_ENABLED:false}
    # requests without a key, limited per IP; remove to require a key
    anonymous:
      requests-per-minute: 10
      daily-tokens: 50000
    # clients:
    #   - name: ci-bot
    #     key-sha256: <printf %s "$KEY" | sha256sum>
    #     requests-per-minute: 60
    #     daily-tokens: 2000000
